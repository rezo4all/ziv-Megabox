<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIV Kitchens — מחולל מדבקות</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@200;300;400;500&family=Alef:wght@400;700&family=Heebo:wght@300;400&family=Noto+Sans+Hebrew:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;background:#0e0e0c;font-family:'Montserrat',sans-serif;color:#e8d5a3;direction:rtl}

:root{
  --gold:#C9A96E;--gold2:#E8D5A3;--gold3:#A07840;--dark:#0e0e0c;--panel:#16160f;
}

.page{max-width:700px;margin:0 auto;padding:48px 24px 80px}

/* Header */
.header{text-align:center;margin-bottom:48px}
.logo-ziv{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:var(--gold);letter-spacing:14px;text-transform:uppercase;line-height:1}
.logo-sub{font-size:10px;letter-spacing:6px;color:rgba(201,169,110,.6);text-transform:uppercase;margin-top:4px}
.header-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto}

/* Search box */
.search-wrap{margin-bottom:40px}
.search-label{font-size:11px;letter-spacing:4px;color:rgba(201,169,110,.7);text-transform:uppercase;margin-bottom:10px;display:block;text-align:center}
.search-row{display:flex;gap:10px;align-items:stretch}
.search-input{
  flex:1;background:rgba(201,169,110,.05);border:1.5px solid rgba(201,169,110,.35);
  color:var(--gold2);font-family:'Courier New',Courier,monospace;font-size:15px;letter-spacing:2px;
  padding:14px 18px;outline:none;direction:ltr;text-align:left;
  transition:border-color .2s,background .2s;
}
.search-input::placeholder{color:rgba(201,169,110,.3);letter-spacing:1px}
.search-input:focus{border-color:var(--gold);background:rgba(201,169,110,.08)}
.search-btn{
  background:var(--gold);color:#0e0e0c;border:none;padding:14px 22px;
  font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;font-weight:500;
  transition:background .2s,opacity .2s;white-space:nowrap;
}
.search-btn:hover{background:var(--gold2)}

/* Autocomplete */
.autocomplete-wrap{position:relative}
.suggestions{
  position:absolute;top:100%;left:0;right:0;background:#1a1a14;
  border:1.5px solid rgba(201,169,110,.4);border-top:none;z-index:100;
  max-height:260px;overflow-y:auto;display:none;
}
.suggestions.show{display:block}
.suggestion-item{
  padding:10px 18px;cursor:pointer;font-size:13px;letter-spacing:1px;
  color:rgba(232,213,163,.8);direction:ltr;text-align:left;
  border-bottom:1px solid rgba(201,169,110,.1);
  font-family:'Courier New',Courier,monospace;
  transition:background .15s;
}
.suggestion-item:hover,.suggestion-item.active{background:rgba(201,169,110,.1);color:var(--gold2)}
.suggestion-item span{color:rgba(201,169,110,.5);font-size:11px;margin-right:8px}

/* Error */
.error-msg{
  text-align:center;padding:20px;color:rgba(201,169,110,.6);
  font-size:13px;letter-spacing:2px;border:1px dashed rgba(201,169,110,.2);
  display:none;
}
.error-msg.show{display:block}

/* ===== THE LABEL ===== */
.label-wrap{display:none}
.label-wrap.show{display:block}

.label-actions{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.action-btn{
  background:transparent;border:1.5px solid rgba(201,169,110,.4);color:var(--gold);
  padding:9px 20px;font-family:'Montserrat',sans-serif;font-size:10px;
  letter-spacing:3px;text-transform:uppercase;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.action-btn:hover{border-color:var(--gold);background:rgba(201,169,110,.07)}

/* Label itself - exact pixel replica of the design */
.label-outer{
  width:420px;margin:0 auto;
  background:#fff;color:#1a1a14;
  border:2px solid #1a1a14;
  font-family:'Alef',sans-serif;
  direction:ltr;
}

.label-top{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px 6px;
  border-bottom:1.5px solid #1a1a14;
  overflow:visible;
}
.label-series-block{display:flex;flex-direction:column;justify-content:center;padding:4px 0;gap:4px}
.label-series{font-size:26px;font-weight:400;font-family:'Alef',sans-serif;line-height:1;color:#1a1a14;letter-spacing:1px}
.label-material{font-size:12px;color:#555;letter-spacing:.5px;font-family:'Alef',sans-serif;font-weight:400;padding-left:1px}

.label-logo{display:flex;align-items:center;overflow:visible}
.label-logo img{height:77px;width:auto;display:block;overflow:visible}

.label-center{
  padding:24px 16px 20px;
  border-bottom:1.5px solid #1a1a14;
  text-align:center;
}
.label-name-en{font-size:30px;font-weight:700;font-family:'Alef',sans-serif;letter-spacing:.5px;color:#1a1a14;line-height:1.1}
.label-name-he{font-size:16px;color:#333;margin-top:6px;font-weight:300;letter-spacing:.3px;direction:rtl;font-family:'Noto Sans Hebrew',sans-serif}
.label-makat-box{
  display:inline-block;border:1.5px solid #1a1a14;
  padding:6px 18px;margin-top:12px;
  font-size:12px;letter-spacing:2px;color:#1a1a14;
  font-family:'Courier New',Courier,monospace;
  direction:ltr;
}

.label-bottom{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;
}
.label-price-name{font-size:13px;font-weight:400;letter-spacing:.5px;color:#1a1a14;font-family:'Alef',sans-serif}
.label-price-code{font-size:13px;font-weight:400;color:#1a1a14;font-family:'Courier New',Courier,monospace;letter-spacing:1px;padding-right:16px}

/* Print styles */
@media print{
  body{background:#fff !important}
  .page{padding:0}
  .header,.search-wrap,.label-actions{display:none !important}
  .label-wrap{display:block !important}
  .label-outer{border:2px solid #000;margin:40px auto}
}
</style>
</head>

<script>
const SHEET_ID = '1snQaI-KuobZtQOCNJ4v9qzBvja9FSQqu8aUvDO9n3dY';
const SHEET_GID = '1973114414'; // גיליון S

async function loadData(forceRefresh = false) {
  const statusEl = document.getElementById('loadStatus');
  if (statusEl) { statusEl.style.display='block'; statusEl.textContent = forceRefresh ? 'מרענן נתונים...' : 'טוען נתונים...'; statusEl.style.color='rgba(201,169,110,0.5)'; }

  return new Promise((resolve) => {
    const cbName = 'zivSheetCB_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      script.remove();
      if (statusEl) { statusEl.textContent = 'עובד עם נתונים מקומיים'; statusEl.style.color='rgba(200,100,100,0.6)'; }
      setTimeout(() => { if (statusEl) statusEl.style.display='none'; }, 3000);
      resolve();
    }, 8000);

    window[cbName] = function(response) {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      try {
        const rows = response.table.rows;
        const cols = response.table.cols;
        const colIdx = {};
        cols.forEach((c, i) => { colIdx[c.label] = i; });

        // Find columns by label (robust against column order changes)
        const makatCol    = Object.keys(colIdx).find(k => k.includes('מק') && k.includes('זיו')) !== undefined
                            ? colIdx[Object.keys(colIdx).find(k => k.includes('מק') && k.includes('זיו'))] : 10;
        const seriesCol   = colIdx['סדרה'] ?? 12;
        const materialCol = Object.keys(colIdx).find(k => k.includes('קבוצת חומר')) !== undefined
                            ? colIdx[Object.keys(colIdx).find(k => k.includes('קבוצת חומר'))] : 13;
        const nameEnCol   = Object.keys(colIdx).find(k => k.includes('EN')) !== undefined
                            ? colIdx[Object.keys(colIdx).find(k => k.includes('EN'))] : 14;
        const nameHeCol   = Object.keys(colIdx).find(k => k.includes('HE')) !== undefined
                            ? colIdx[Object.keys(colIdx).find(k => k.includes('HE'))] : 15;
        const priceCodeCol = colIdx['קוד קבוצת מחיר'] ?? 16;
        const priceNameCol = colIdx['שם קבוצת מחיר'] ?? 17;

        const data = [];
        rows.forEach(row => {
          const c = row.c;
          const makat = c[makatCol]?.v?.toString().trim();
          if (!makat) return;
          data.push({
            makat,
            series:     (c[seriesCol]?.v||'').toString().trim(),
            material:   (c[materialCol]?.v||'').toString().trim(),
            name_en:    (c[nameEnCol]?.v||'').toString().trim(),
            name_he:    (c[nameHeCol]?.v||'').toString().trim(),
            price_code: (c[priceCodeCol]?.v||'').toString().trim(),
            price_name: (c[priceNameCol]?.v||'').toString().trim(),
          });
        });
        DB = data;
        if (statusEl) { statusEl.textContent = (forceRefresh ? '✓ עודכן — ' : '') + DB.length + ' פריטים נטענו'; statusEl.style.color='rgba(100,200,100,0.7)'; }
        setTimeout(() => { if (statusEl) statusEl.style.display='none'; }, 2500);
      } catch(e) {
        if (statusEl) { statusEl.textContent = 'שגיאה בעיבוד — ' + e.message; statusEl.style.color='rgba(200,100,100,0.6)'; }
        setTimeout(() => { if (statusEl) statusEl.style.display='none'; }, 4000);
      }
      resolve();
    };

    // Use gid directly — most reliable way to target specific sheet
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}&callback=${cbName}&_=${Date.now()}`;
    document.head.appendChild(script);
  });
}
    document.head.appendChild(script);

}

const input = document.getElementById('makatInput');
const suggestionsEl = document.getElementById('suggestions');
let activeIdx = -1;

input.addEventListener('input', () => {
  const q = input.value.trim().toUpperCase();
  if (q.length < 1) { suggestionsEl.classList.remove('show'); return; }
  const matches = DB.filter(r => r.makat.toUpperCase().startsWith(q)).slice(0, 10);
  if (!matches.length) { suggestionsEl.classList.remove('show'); return; }
  suggestionsEl.innerHTML = matches.map((r, i) =>
    `<div class="suggestion-item" data-makat="${r.makat}">
      ${r.makat} <span>${r.name_en} · ${r.series}</span>
    </div>`
  ).join('');
  suggestionsEl.classList.add('show');
  activeIdx = -1;
});

input.addEventListener('keydown', (e) => {
  const items = suggestionsEl.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown') { activeIdx = Math.min(activeIdx+1, items.length-1); highlight(items); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { activeIdx = Math.max(activeIdx-1, 0); highlight(items); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (activeIdx >= 0 && items[activeIdx]) {
      input.value = items[activeIdx].dataset.makat;
      suggestionsEl.classList.remove('show');
    }
    generateLabel();
  }
  else if (e.key === 'Escape') { suggestionsEl.classList.remove('show'); }
});

suggestionsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.suggestion-item');
  if (item) { input.value = item.dataset.makat; suggestionsEl.classList.remove('show'); generateLabel(); }
});

document.addEventListener('click', (e) => { if (!e.target.closest('.autocomplete-wrap')) suggestionsEl.classList.remove('show'); });

function highlight(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
}

function generateLabel() {
  suggestionsEl.classList.remove('show');
  const q = input.value.trim();
  const rec = DB.find(r => r.makat.toLowerCase() === q.toLowerCase());
  const errorEl = document.getElementById('errorMsg');
  const wrapEl = document.getElementById('labelWrap');

  if (!rec) {
    errorEl.classList.add('show');
    wrapEl.classList.remove('show');
    return;
  }
  errorEl.classList.remove('show');

  document.getElementById('lSeries').textContent = rec.series;
  document.getElementById('lMaterial').textContent = rec.material;
  document.getElementById('lNameEn').textContent = rec.name_en;
  document.getElementById('lNameHe').textContent = rec.name_he;
  document.getElementById('lMakat').textContent = rec.makat;
  document.getElementById('lPriceName').textContent = rec.price_name || '—';
  document.getElementById('lPriceCode').textContent = rec.price_code || '—';

  wrapEl.classList.add('show');
  wrapEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyLabel() {
  const makat = document.getElementById('lMakat').textContent;
  const rec = DB.find(r => r.makat === makat);
  if (!rec) return;
  const txt = `Series: ${rec.series}\nMaterial: ${rec.material}\nEN: ${rec.name_en}\nHE: ${rec.name_he}\nMakat: ${rec.makat}\nPrice: ${rec.price_name} (${rec.price_code})`;
  navigator.clipboard.writeText(txt).then(() => alert('הנתונים הועתקו'));
}

  `);

// Multi-label cart system
let labelCart = [];

function openMultiDialog() {
  document.getElementById('multiDialog').style.display = 'block';
  setupDialogAutocomplete();
  updateCartDisplay();
}

function closeDialog() {
  document.getElementById('multiDialog').style.display = 'none';
}

function setupDialogAutocomplete() {
  const input = document.getElementById('dialogInput');
  const suggestionsEl = document.getElementById('dialogSuggestions');
  
  input.addEventListener('input', () => {
    const q = input.value.trim().toUpperCase();
    if (q.length < 1) { 
      suggestionsEl.classList.remove('show'); 
      return; 
    }
    
    const matches = DB.filter(r => r.makat.toUpperCase().includes(q)).slice(0, 8);
    
    if (!matches.length) { 
      suggestionsEl.classList.remove('show'); 
      return; 
    }
    
    suggestionsEl.innerHTML = matches.map(r =>
      `<div class="suggestion-item" onclick="selectDialogItem('${r.makat}')">
        ${r.makat} <span>${r.name_en} · ${r.series}</span>
      </div>`
    ).join('');
    
    suggestionsEl.classList.add('show');
  });
}

function selectDialogItem(makat) {
  document.getElementById('dialogInput').value = makat;
  document.getElementById('dialogSuggestions').classList.remove('show');
  addToCart();
}

function addToCart() {
  const input = document.getElementById('dialogInput');
  const makat = input.value.trim();
  const item = DB.find(r => r.makat.toLowerCase() === makat.toLowerCase());
  
  if (!item) {
    alert('מק"ט לא נמצא');
    return;
  }
  
  // Check current total labels
  const currentTotal = labelCart.reduce((sum, cartItem) => sum + cartItem.quantity, 0);
  
  if (currentTotal >= 8) {
    alert('הגעת למקסימום 8 מדבקות');
    return;
  }
  
  // Check if item already exists in cart
  const existingIndex = labelCart.findIndex(cartItem => cartItem.makat === item.makat);
  
  if (existingIndex >= 0) {
    // Increase quantity only if total won't exceed 8
    if (currentTotal < 8) {
      labelCart[existingIndex].quantity++;
    } else {
      alert('הגעת למקסימום 8 מדבקות');
      return;
    }
  } else {
    // Add new item with quantity 1
    labelCart.push({...item, quantity: 1});
  }
  
  input.value = '';
  updateCartDisplay();
}

function updateCartDisplay() {
  const container = document.getElementById('cartItems');
  const printBtn = document.getElementById('printCartBtn');
  
  if (labelCart.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:rgba(201,169,110,.4); padding:20px;">אין פריטים נבחרים</div>';
    printBtn.style.display = 'none';
    return;
  }
  
  container.innerHTML = labelCart.map((item, index) =>
    `<div style="display:flex; justify-content:space-between; align-items:center; border:1px solid rgba(201,169,110,.3); padding:10px; margin-bottom:8px; background:rgba(201,169,110,.08);">
      <div style="flex:1;">
        <div style="color:var(--gold2); font-size:14px;">${item.makat}</div>
        <div style="color:rgba(201,169,110,.7); font-size:12px;">${item.name_en} · ${item.series}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button onclick="changeQuantity(${index}, -1)" style="background:none; border:1px solid var(--gold); color:var(--gold); width:25px; height:25px; cursor:pointer; display:flex; align-items:center; justify-content:center;">-</button>
        <span style="color:var(--gold); font-weight:bold; min-width:20px; text-align:center;">${item.quantity}</span>
        <button onclick="changeQuantity(${index}, 1)" style="background:none; border:1px solid var(--gold); color:var(--gold); width:25px; height:25px; cursor:pointer; display:flex; align-items:center; justify-content:center;">+</button>
        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:rgba(201,169,110,.6); cursor:pointer; padding:2px 6px; font-size:16px; margin-left:10px;">×</button>
      </div>
    </div>`
  ).join('');
  
  const totalLabels = labelCart.reduce((sum, item) => sum + item.quantity, 0);
  container.innerHTML += `<div style="text-align:center; margin-top:15px; padding:10px; border-top:1px solid rgba(201,169,110,.3); color:var(--gold); font-size:14px;">סך הכל: ${totalLabels} מדבקות</div>`;
  
  printBtn.style.display = totalLabels > 0 ? 'inline-block' : 'none';
}

function changeQuantity(index, delta) {
  const currentTotal = labelCart.reduce((sum, cartItem) => sum + cartItem.quantity, 0);
  
  if (delta > 0 && currentTotal >= 8) {
    alert('הגעת למקסימום 8 מדבקות');
    return;
  }
  
  labelCart[index].quantity += delta;
  
  if (labelCart[index].quantity <= 0) {
    labelCart.splice(index, 1);
  }
  
  updateCartDisplay();
}

function removeFromCart(index) {
  labelCart.splice(index, 1);
  updateCartDisplay();
}

function clearCart() {
  labelCart = [];
  updateCartDisplay();
}



function printCart() {
  if (labelCart.length === 0) return;

  const labelEl = document.getElementById('labelEl');
  if (!labelEl) return;

  // Build list (quantities expanded, pad to 8)
  const labelsToShow = [];
  for (const cartItem of labelCart) {
    for (let i = 0; i < cartItem.quantity; i++) labelsToShow.push(cartItem);
  }
  while (labelsToShow.length < 8) labelsToShow.push(null);

  // Take labelEl.outerHTML exactly as printPDF does, swap text only
  function makeLabelHTML(item) {
    let html = labelEl.outerHTML.replace('label-outer', 'label-clone');
    html = html.replace(/id="l[A-Za-z]+"/g, '');
    html = html.replace(/(<div [^>]*class="label-series"[^>]*>)[^<]*(<)/,  `$1${item.series}$2`);
    html = html.replace(/(<div [^>]*class="label-material"[^>]*>)[^<]*(<)/, `$1${item.material}$2`);
    html = html.replace(/(<div [^>]*class="label-name-en"[^>]*>)[^<]*(<)/,  `$1${item.name_en}$2`);
    html = html.replace(/(<div [^>]*class="label-name-he"[^>]*>)[^<]*(<)/,  `$1${item.name_he}$2`);
    html = html.replace(/(<div [^>]*class="label-makat-box"[^>]*>)[^<]*(<)/, `$1${item.makat}$2`);
    html = html.replace(/(<div [^>]*class="label-price-name"[^>]*>)[^<]*(<)/, `$1${item.price_name || '—'}$2`);
    html = html.replace(/(<div [^>]*class="label-price-code"[^>]*>)[^<]*(<)/, `$1${item.price_code || ''}$2`);
    return html;
  }

  const printWin = window.open('', '_blank');
  printWin.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>ZIV Labels Print Sheet</title>
      <style>
        @page { size: A4; margin: 3mm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: white; width: 204mm; height: 291mm; }
        .sheet {
          width: 204mm; height: 291mm;
          display: grid;
          grid-template-columns: repeat(2, 99mm);
          grid-template-rows: repeat(4, 66.75mm);
          gap: 6mm; position: absolute; top: 0; left: 0;
        }
        .label-clone { width: 99mm; height: 66.75mm; border: 1px solid #1a1a14; background: white; display: flex; flex-direction: column; }
        .label-clone.empty { border: 2px dashed #ddd; background: #f9f9f9; align-items: center; justify-content: center; color: #ccc; font-size: 14px; }
        .label-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 24px 6px; border-bottom: 1.5px solid #1a1a14; overflow: visible; }
        .label-series-block { display: flex; flex-direction: column; justify-content: center; padding: 3px 0; gap: 2px; }
        .label-series { font-size: 26px; font-weight: 400; font-family: 'Alef', sans-serif; line-height: 1; color: #1a1a14; letter-spacing: 1px; }
        .label-material { font-size: 14px; font-weight: bold; color: #555; letter-spacing: .5px; font-family: 'Alef', sans-serif; padding-left: 1px; }
        .label-logo { display: flex; align-items: center; overflow: visible; margin-right: -12px; }
        .label-logo img { height: 65px; width: auto; display: block; overflow: visible; }
        .label-center { padding: 16px 24px 14px; border-bottom: 1.5px solid #1a1a14; text-align: center; }
        .label-name-en { font-size: 26px; font-weight: 400; font-family: 'Alef', sans-serif; color: #1a1a14; letter-spacing: 1.5px; line-height: 1.1; }
        .label-name-he { font-size: 19px; font-weight: 400; color: #333; margin-top: 5px; letter-spacing: .3px; direction: rtl; font-family: 'Noto Sans Hebrew', sans-serif; }
        .label-makat-box { display: inline-block; border: 1.5px solid #1a1a14; padding: 5px 10px; margin-top: 10px; font-size: 14px; font-weight: 400; color: #1a1a14; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        .label-bottom { display: flex; justify-content: space-between; align-items: center; padding: 9px 24px; height: auto; min-height: 30px; }
        .label-price-name { font-size: 11px; font-weight: bold; color: #1a1a14; font-family: 'Alef', sans-serif; letter-spacing: .5px; }
        .label-price-code { font-size: 17px; font-weight: bold; color: #1a1a14; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; padding-right: 0; }
        @media print { .sheet { height: 297mm; } }
      </style>
    </head>
    <body>
      <div class="sheet">
        ${labelsToShow.map(item => item ? makeLabelHTML(item) : '<div class="label-clone empty">מדבקה ריקה</div>').join('')}
      </div>
    </body>
    </html>
  `);
  printWin.document.close();
  setTimeout(() => { printWin.print(); setTimeout(() => printWin.close(), 1000); }, 500);
}

</script>
